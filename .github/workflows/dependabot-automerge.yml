name: dependabot-automerge

on:
  workflow_call:

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Sem branch protection exigindo review nestes repos: o job so roda apos o
      # build (needs: [build]) ja ter passado, entao merge direto e suficiente.
      # Nao aprovar PR evita depender da config can_approve_pull_request_reviews.
      - run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
