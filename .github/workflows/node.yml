name: node

on:
  workflow_call:
    inputs:
      node-version:
        description: Fallback Node version when the repo has no .nvmrc
        type: string
        default: "20"
      working-directory:
        description: Directory holding package.json
        type: string
        default: "."

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect toolchain
        id: d
        run: |
          # Ordem = lockfiles que o Dependabot mantem primeiro. bun.lock fica por ultimo
          # e sem --frozen-lockfile: o Dependabot atualiza package.json sem regravar ele.
          if   [ -f pnpm-lock.yaml ]; then pm=pnpm; install="pnpm install --frozen-lockfile"
          elif [ -f yarn.lock ]; then
            pm=yarn
            if [ -f .yarnrc.yml ]; then install="yarn install --immutable"
            else install="yarn install --frozen-lockfile"; fi
          elif [ -f package-lock.json ]; then pm=npm; install="npm ci"
          elif [ -f bun.lock ] || [ -f bun.lockb ]; then pm=bun; install="bun install"
          else pm=npm; install="npm install"; fi

          cache=$pm
          case "$install" in "bun install"|"npm install") cache="" ;; esac

          if [ -f .nvmrc ]; then node="$(tr -dc '0-9.' < .nvmrc)"; else node="${{ inputs.node-version }}"; fi

          # pnpm/action-setup exige uma versao quando o package.json nao traz packageManager
          pnpmv=$(node -p "const p=require('./package.json');(p.packageManager||'').startsWith('pnpm@')?p.packageManager.slice(5):((p.engines||{}).pnpm||'latest')" 2>/dev/null || echo latest)

          {
            echo "pm=$pm"
            echo "install=$install"
            echo "cache=$cache"
            echo "node=$node"
            echo "pnpmv=$pnpmv"
          } >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.d.outputs.pm == 'pnpm'
        with:
          version: ${{ steps.d.outputs.pnpmv }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.d.outputs.pm == 'bun'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.d.outputs.node }}
          cache: ${{ steps.d.outputs.cache }}
          cache-dependency-path: ${{ inputs.working-directory }}

      - name: Install
        run: ${{ steps.d.outputs.install }}

      - name: Verify
        run: |
          has() { node -e "process.exit((require('./package.json').scripts||{})['$1'] ? 0 : 1)"; }
          run() { if has "$1"; then echo "::group::$1"; ${{ steps.d.outputs.pm }} run "$1"; echo "::endgroup::"; fi; }

          run lint
          run typecheck
          run type-check
          if has test:ci; then run test:ci; else run test; fi
          run build
